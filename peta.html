<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta Laporan – SILAPOR Wonogiri</title>
  <meta name="description" content="Lihat sebaran laporan warga Wonogiri di peta interaktif, dengan warna berdasarkan status penanganan.">
  <meta name="theme-color" content="#6B8F71">
  <!-- Inline font restore -->
  <script>
    try {
      const i = Number(localStorage.getItem('silapor_font_idx') ?? 1);
      const s = [87.5,100,112.5,125,150];
      document.documentElement.style.fontSize = (s[i] ?? 100) + '%';
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        sage:  { 50:'#F2F6F3', 100:'#E1EBE3', 500:'#6B8F71', 600:'#58795E', 700:'#4A6850' },
        amber: { cta:'#F59E0B', ctahover:'#D98706' },
        ink:   '#1F2937'
      },
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex h-dvh flex-col bg-[#FAFAF7] font-sans text-ink">
  <header id="navbar"></header>

  <main class="relative min-h-0 flex-1">
    <!-- Peta fullscreen -->
    <div id="map" class="absolute inset-0"
         role="application"
         aria-label="Peta sebaran laporan warga Wonogiri"></div>

    <!-- Panel legenda & filter – floating di atas peta -->
    <section class="absolute inset-x-3 top-3 z-10 mx-auto max-w-xl rounded-2xl bg-white/95 p-4 shadow-xl backdrop-blur-md animate-slide-down"
             aria-label="Legenda dan filter peta">

      <div class="flex items-center justify-between gap-3 mb-3">
        <div class="flex items-center gap-2">
          <!-- Back button compact -->
          <a href="/index.html"
             aria-label="Kembali ke beranda"
             class="flex h-9 w-9 items-center justify-center rounded-xl border border-sage-100 bg-white text-sage-700 hover:bg-sage-50 shadow-sm transition-all shrink-0">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
            </svg>
          </a>
          <div>
            <h1 class="font-extrabold text-sage-700 text-base leading-tight">Peta Laporan Warga</h1>
            <p id="jumlah" class="text-[11px] text-gray-400 leading-tight" aria-live="polite">Memuat data…</p>
          </div>
        </div>
        <!-- Tombol lokasi saya -->
        <button id="btn-lokasi-saya" type="button"
                aria-label="Tampilkan lokasi saya di peta"
                class="flex h-9 shrink-0 items-center gap-1.5 rounded-xl border border-sage-200 bg-white px-3 text-xs font-bold text-sage-700 hover:bg-sage-50 shadow-sm transition-all">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>
          </svg>
          Lokasi Saya
        </button>
      </div>

      <!-- Filter tombol per status -->
      <div id="legenda" class="flex flex-wrap gap-2"></div>

      <p class="mt-2 text-[11px] text-gray-400">Ketuk warna untuk filter · Ketuk titik di peta untuk detail</p>
    </section>

    <!-- Loading overlay -->
    <div id="peta-loading"
         class="absolute inset-0 z-20 flex items-center justify-center bg-[#FAFAF7]/80 backdrop-blur-sm">
      <div class="flex flex-col items-center gap-3">
        <div class="h-10 w-10 animate-spin rounded-full border-4 border-sage-200 border-t-sage-500"></div>
        <p class="text-sm font-semibold text-sage-700">Memuat data peta…</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/peta.js"></script>
</body>
</html>
