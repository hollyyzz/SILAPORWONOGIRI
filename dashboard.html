<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Admin – SILAPOR Wonogiri</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6B8F71">
  <!-- Auth guard sinkron (cek sesi Supabase di localStorage) -->
  <script>
    // Cek minimal: Supabase menyimpan token di key sb-*-auth-token
    // Guard lebih ketat ada di admin.js (async, verifikasi server)
    try {
      const keys = Object.keys(localStorage);
      const hasToken = keys.some(k => k.startsWith('sb-') && k.endsWith('-auth-token'));
      if (!hasToken) {
        // Tidak ada token sama sekali → langsung redirect
        location.replace('login.html');
      }
    } catch { /* localStorage diblokir: biarkan admin.js yg redirect */ }
  </script>
  <!-- Inline font restore -->
  <script>
    try {
      const i = Number(localStorage.getItem('silapor_font_idx') ?? 1);
      const s = [87.5,100,112.5,125,150];
      document.documentElement.style.fontSize = (s[i] ?? 100) + '%';
    } catch {}
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        sage:  { 50:'#F2F6F3', 100:'#E1EBE3', 500:'#6B8F71', 600:'#58795E', 700:'#4A6850' },
        amber: { cta:'#F59E0B', ctahover:'#D98706' },
        ink:   '#1F2937'
      },
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard" class="min-h-screen bg-[#FAFAF7] pb-12 font-sans text-ink">
  <header id="navbar"></header>

  <main class="mx-auto max-w-5xl space-y-5 px-4 py-6">

    <!-- ══ Judul + Tombol aksi ══════════════════════════════════ -->
    <section class="flex flex-wrap items-center justify-between gap-3 animate-fade-in-up">
      <div>
        <h1 class="text-2xl font-extrabold text-sage-700">
          <span class="mr-2">📋</span>Antrean Laporan
        </h1>
        <p class="text-sm text-gray-500 mt-0.5">
          Masuk sebagai <span id="admin-email" class="font-semibold text-ink"></span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2">
        <a href="peta.html"
           class="flex h-10 items-center gap-2 rounded-xl border-2 border-sage-500 px-4 text-sm font-bold text-sage-700 hover:bg-sage-50 transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
          </svg>
          Lihat Peta
        </a>
        <button id="btn-keluar" type="button"
                class="flex h-10 items-center gap-2 rounded-xl bg-white px-4 text-sm font-bold text-gray-600 shadow-sm ring-1 ring-gray-200 hover:bg-red-50 hover:text-red-600 hover:ring-red-200 transition-all">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M18 15l3-3m0 0-3-3m3 3H9"/>
          </svg>
          Keluar
        </button>
      </div>
    </section>

    <!-- ══ Metrik Ringkasan ═════════════════════════════════════ -->
    <section class="grid grid-cols-3 gap-3 stagger" aria-label="Ringkasan statistik laporan">
      <div class="metric-card card-hover animate-fade-in-up rounded-2xl border-l-4 border-red-400">
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-500">
          <span class="h-2.5 w-2.5 rounded-full bg-red-500"></span>Baru
        </div>
        <p id="m-baru" class="mt-2 text-3xl font-extrabold text-red-600">0</p>
        <p class="hidden text-xs text-gray-400 sm:block mt-0.5">Belum ditangani</p>
      </div>
      <div class="metric-card card-hover animate-fade-in-up rounded-2xl border-l-4 border-yellow-400">
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-500">
          <span class="h-2.5 w-2.5 rounded-full bg-yellow-500"></span>Diproses
        </div>
        <p id="m-diproses" class="mt-2 text-3xl font-extrabold text-yellow-600">0</p>
        <p class="hidden text-xs text-gray-400 sm:block mt-0.5">Sedang ditindaklanjuti</p>
      </div>
      <div class="metric-card card-hover animate-fade-in-up rounded-2xl border-l-4 border-green-400">
        <div class="flex items-center gap-2 text-xs font-semibold text-gray-500">
          <span class="h-2.5 w-2.5 rounded-full bg-green-500"></span>Selesai
        </div>
        <p id="m-selesai" class="mt-2 text-3xl font-extrabold text-green-600">0</p>
        <p class="hidden text-xs text-gray-400 sm:block mt-0.5">Sudah ditangani</p>
      </div>
    </section>

    <!-- ══ Filter & Pencarian ══════════════════════════════════ -->
    <section class="space-y-3 rounded-2xl bg-white p-4 shadow-md animate-fade-in-up">
      <div class="relative">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
        </svg>
        <label for="cari" class="sr-only">Cari laporan</label>
        <input id="cari" type="search"
               placeholder="Cari kode tiket, kategori, atau isi laporan…"
               class="h-12 w-full rounded-xl border border-gray-200 bg-gray-50 pl-11 pr-4 focus:bg-white focus:border-sage-500 focus:outline-none focus:ring-2 focus:ring-sage-500/30 transition-all">
      </div>
      <div id="filter" class="flex gap-2 overflow-x-auto hide-scroll" role="group" aria-label="Filter status"></div>
    </section>

    <!-- ══ Tabel (Desktop) ═════════════════════════════════════ -->
    <div class="hidden overflow-hidden rounded-2xl bg-white shadow-md animate-fade-in-up md:block">
      <table class="w-full text-left text-sm">
        <thead class="bg-sage-50 text-xs uppercase tracking-wide text-sage-700">
          <tr>
            <th scope="col" class="px-5 py-4">Tiket</th>
            <th scope="col" class="px-5 py-4">Tanggal</th>
            <th scope="col" class="px-5 py-4">Kategori &amp; Deskripsi</th>
            <th scope="col" class="px-5 py-4">Status</th>
            <th scope="col" class="px-5 py-4">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbody" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>

    <!-- ══ Kartu (HP) ══════════════════════════════════════════ -->
    <div id="kartu" class="space-y-3 md:hidden"></div>

    <!-- Empty state -->
    <p id="kosong" class="hidden rounded-2xl bg-white p-10 text-center text-sm font-semibold text-gray-400 shadow-md">
      <span class="text-3xl block mb-2">📭</span>
      Tidak ada laporan yang cocok dengan filter.
    </p>
  </main>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
