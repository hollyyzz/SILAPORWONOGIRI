<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lacak Laporan – SILAPOR Wonogiri</title>
  <meta name="description" content="Masukkan kode tiket untuk memantau status laporan Anda di SILAPOR Wonogiri.">
  <meta name="theme-color" content="#6B8F71">
  <!-- Inline font restore -->
  <script>
    try {
      const i = Number(localStorage.getItem('silapor_font_idx') ?? 1);
      const s = [87.5,100,112.5,125,150];
      document.documentElement.style.fontSize = (s[i] ?? 100) + '%';
    } catch {}
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        sage:  { 50:'#F2F6F3', 100:'#E1EBE3', 500:'#6B8F71', 600:'#58795E', 700:'#4A6850' },
        amber: { cta:'#F59E0B', ctahover:'#D98706' },
        ink:   '#1F2937'
      },
      fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] }
    } } }
  </script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen bg-[#FAFAF7] font-sans text-ink">
  <header id="navbar"></header>

  <main class="mx-auto max-w-3xl space-y-5 px-4 py-6">

    <!-- Tombol Kembali -->
    <a href="/index.html"
       class="inline-flex items-center gap-2 rounded-xl border border-sage-100 bg-white px-4 py-2.5 text-sm font-semibold text-sage-700 shadow-sm hover:bg-sage-50 transition-all animate-fade-in-up">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
      </svg>
      Kembali ke Beranda
    </a>

    <!-- Form Cari Tiket -->
    <section class="rounded-2xl bg-white p-6 shadow-md animate-fade-in-up" aria-labelledby="lacak-heading">
      <div class="flex items-center gap-3 mb-4">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-sage-50 text-sage-600">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
          </svg>
        </div>
        <div>
          <h1 id="lacak-heading" class="text-xl font-extrabold text-sage-700">Lacak Laporan</h1>
          <p class="text-sm text-gray-400">Masukkan kode tiket yang Anda terima setelah melapor.</p>
        </div>
      </div>

      <form id="form-cari" class="space-y-3" novalidate>
        <div class="relative">
          <label for="kode" class="sr-only">Kode tiket</label>
          <input id="kode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
                 placeholder="#LPR-202610-001"
                 class="h-14 w-full rounded-xl border border-gray-200 bg-gray-50 pl-5 pr-14 text-lg font-bold uppercase tracking-wider placeholder:font-normal placeholder:normal-case placeholder:tracking-normal placeholder:text-gray-300 focus:bg-white transition-all focus:border-sage-500 focus:outline-none focus:ring-2 focus:ring-sage-500/30">
          <!-- Clear button -->
          <button type="button" id="btn-clear"
                  class="absolute right-3 top-1/2 -translate-y-1/2 hidden h-8 w-8 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition-all"
                  aria-label="Hapus input">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <button type="submit"
                class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-amber-cta font-bold text-ink shadow-md hover:bg-amber-ctahover hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-amber-cta/40 transition-all">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M17 10.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"/>
          </svg>
          Cari Tiket
        </button>
      </form>

      <!-- Contoh cepat -->
      <p class="mt-3 text-xs text-gray-400">
        Uji coba:
        <button type="button" id="contoh"
                class="font-bold text-sage-600 hover:underline ml-1">#LPR-202610-001</button>
      </p>
    </section>

    <!-- Alert / pesan error -->
    <p id="pesan" role="alert" class="hidden rounded-xl bg-red-50 border border-red-100 px-4 py-3 text-sm font-semibold text-red-700"></p>

    <!-- Hasil Lacak -->
    <section id="hasil" class="hidden space-y-4 animate-fade-in-up" aria-live="polite">

      <!-- Ringkasan laporan -->
      <div class="rounded-2xl bg-white p-5 shadow-md">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p id="h-kode" class="text-xl font-extrabold text-sage-700"></p>
            <p id="h-meta" class="mt-0.5 text-sm text-gray-400"></p>
          </div>
          <span id="h-badge" class="shrink-0 rounded-full px-3 py-1.5 text-xs font-bold"></span>
        </div>

        <p id="h-deskripsi" class="mt-4 rounded-xl bg-gray-50 p-3 text-sm text-gray-700 leading-relaxed"></p>

        <!-- Foto -->
        <div id="h-foto-wrap" class="mt-4 hidden">
          <img id="h-foto" alt="Foto laporan" class="w-full max-h-60 rounded-2xl object-cover shadow-sm">
        </div>
      </div>

      <!-- Timeline -->
      <div class="rounded-2xl bg-white p-5 shadow-md">
        <h2 class="mb-5 font-extrabold text-sage-700">📅 Perkembangan Laporan</h2>
        <ol id="timeline" class="space-y-5"></ol>
      </div>

      <!-- Catatan admin -->
      <div id="h-catatan-wrap" class="hidden rounded-2xl bg-amber-50 border border-amber-100 p-5">
        <h3 class="font-bold text-amber-800 mb-2">💬 Catatan dari Perangkat Desa</h3>
        <p id="h-catatan" class="text-sm text-amber-700"></p>
      </div>
    </section>

    <!-- Empty state: tiket tidak ditemukan -->
    <div id="tidak-ditemukan" class="hidden rounded-2xl bg-white p-8 text-center shadow-md animate-fade-in-up">
      <p class="text-4xl mb-3">🔍</p>
      <h2 class="font-extrabold text-gray-700">Tiket Tidak Ditemukan</h2>
      <p class="mt-2 text-sm text-gray-400">Pastikan kode tiket diketik dengan benar. Contoh: <code class="rounded bg-gray-100 px-1.5 py-0.5 font-mono text-xs">#LPR-202610-001</code></p>
    </div>

  </main>

  <script type="module" src="/js/main.js"></script>
  <script type="module" src="/js/lacak.js"></script>

  <!-- Tombol clear & UX kecil -->
  <script>
    const inp = document.getElementById('kode');
    const clr = document.getElementById('btn-clear');
    if (inp && clr) {
      inp.addEventListener('input', () => {
        clr.classList.toggle('hidden', !inp.value);
        clr.classList.toggle('flex',  !!inp.value);
      });
      clr.addEventListener('click', () => {
        inp.value = '';
        clr.classList.add('hidden');
        clr.classList.remove('flex');
        inp.focus();
      });
    }
  </script>
</body>
</html>
